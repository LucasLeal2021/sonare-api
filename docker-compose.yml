# Floci (emulador local da AWS, https://floci.io) + o Mongo do DocumentDB + a API da Sonare.
#
# Dia a dia:    docker compose up          (deixe rodando; mostra os logs; Ctrl+C para parar)
# Em 2º plano:  docker compose up -d       (e depois: docker compose logs -f api)
# Testes:       docker compose run --rm api npm run test:integracao
# Parar tudo:   docker compose down
# Instalou uma dependência nova? docker compose up --build -V
#   (o -V descarta o node_modules antigo do container; sem ele, o pacote novo "não existe")
services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"                     # porta única onde todos os serviços AWS atendem
    environment:
      - FLOCI_HOSTNAME=floci            # outros containers (ex.: sonare-ia) acessam via http://floci:4566
      - FLOCI_STORAGE_MODE=persistent   # buckets, tabelas e filas sobrevivem a reinícios
      - FLOCI_STORAGE_PERSISTENT_PATH=/data
      - FLOCI_SERVICES_DOCDB_DOCKER_NETWORK=sonare-net  # o MongoDB de cada cluster DocumentDB nasce nesta rede
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # o Floci roda Lambdas, EC2 e bancos como containers Docker
      - ./.floci-data:/data             # onde o estado da "AWS local" fica salvo

  # O Floci não religa sozinho o container Mongo que ele criou para o DocumentDB (ADR 0002).
  # Este ajudante liga o Mongo assim que o Floci fica pronto, e termina.
  religar-documentdb:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      floci:
        condition: service_healthy
    command: ["sh", "-c", "docker start floci-docdb-sonare-local-criacoes || echo 'Mongo ainda não existe: rode o terraform apply do infra/base'"]

  api:
    build: .
    ports:
      - "3333:3333"                     # o navegador e o curl acessam http://localhost:3333
    volumes:
      - .:/app                          # seu código, editado no Windows, visto pelo container
      - /app/node_modules               # mas as dependências são as do Linux, instaladas na imagem
    environment:
      AMBIENTE: local
      PORTA: 3333
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
      S3_ENDPOINT_PUBLICO: http://localhost:4566   # endereço do S3 que o NAVEGADOR enxerga (links do Áudio)
      # O Floci cria o Mongo do DocumentDB como "floci-docdb-<cluster>"; pelo nome, o Docker sempre
      # acha o IP certo (o IP que o Floci informa fica velho quando o container reinicia — ADR 0002)
      DOCUMENTDB_HOST: floci-docdb-sonare-local-criacoes
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      floci:
        condition: service_healthy
      religar-documentdb:
        condition: service_completed_successfully
    command: npm run dev                # nodemon --legacy-watch: confere os arquivos a cada segundo e reinicia ao salvar

networks:
  default:
    name: sonare-net                    # rede com nome fixo para o sonare-ia se conectar
